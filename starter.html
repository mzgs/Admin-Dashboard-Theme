<!doctype html>
<html lang="en" data-bs-theme="dark" data-theme-storage="theme">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An empty admin dashboard starter with sidebar, top bar, and footer.">
  <title>Dashboard · Evergreen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://mzgs.github.io/fa7/css/all.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="sidebar-expanded dashboard-page" data-sidebar-layout>
  <a class="visually-hidden-focusable skip-link" href="#main">Skip to main content</a>
  <aside id="sidebar" class="sidebar" aria-label="Main navigation">
    <div class="sidebar-header">
      <div class="workspace-switcher"><span class="workspace-mark" aria-hidden="true"></span><span>Evergreen</span></div>
      <button type="button" class="rail-button sidebar-toggle" aria-label="Collapse navigation" aria-expanded="true" aria-controls="sidebar" title="Collapse navigation">
        <i class="fa-light fa-sidebar" aria-hidden="true"></i>
      </button>
    </div>
    <nav class="sidebar-nav" aria-label="Pages">
      <!-- Replace the sample hash destinations with your application's pages. -->
      <section class="sidebar-group">
        <button type="button" class="sidebar-group-title" data-bs-toggle="collapse" data-bs-target="#overview-links" aria-expanded="true" aria-controls="overview-links">
          Overview <i class="fa-light fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div id="overview-links" class="collapse show">
          <div class="sidebar-links">
            <a class="rail-button active" href="#dashboard" aria-current="location" aria-label="Dashboard" title="Dashboard">
              <i class="fa-light fa-house" aria-hidden="true"></i><span>Dashboard</span>
            </a>
            <a class="rail-button" href="#analytics" aria-label="Analytics" title="Analytics">
              <i class="fa-light fa-chart-line" aria-hidden="true"></i><span>Analytics</span>
            </a>
          </div>
        </div>
      </section>
      <section class="sidebar-group">
        <button type="button" class="sidebar-group-title" data-bs-toggle="collapse" data-bs-target="#management-links" aria-expanded="true" aria-controls="management-links">
          Management <i class="fa-light fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div id="management-links" class="collapse show">
          <div class="sidebar-links">
            <a class="rail-button" href="#users" aria-label="Users" title="Users">
              <i class="fa-light fa-users" aria-hidden="true"></i><span>Users</span>
            </a>
            <a class="rail-button" href="#projects" aria-label="Projects" title="Projects">
              <i class="fa-light fa-folder" aria-hidden="true"></i><span>Projects</span>
            </a>
            <a class="rail-button" href="#transactions" aria-label="Transactions" title="Transactions">
              <i class="fa-light fa-arrows-rotate" aria-hidden="true"></i><span>Transactions</span>
            </a>
          </div>
        </div>
      </section>
      <section class="sidebar-group">
        <button type="button" class="sidebar-group-title" data-bs-toggle="collapse" data-bs-target="#system-links" aria-expanded="true" aria-controls="system-links">
          System <i class="fa-light fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div id="system-links" class="collapse show">
          <div class="sidebar-links">
            <a class="rail-button" href="#settings" aria-label="Settings" title="Settings">
              <i class="fa-light fa-gear" aria-hidden="true"></i><span>Settings</span>
            </a>
            <a class="rail-button" href="index.html" aria-label="Components" title="Components">
              <i class="fa-light fa-layer-group" aria-hidden="true"></i><span>Components</span>
            </a>
          </div>
        </div>
      </section>
    </nav>
    <div class="sidebar-bottom">
      <div class="rail-button profile-button" aria-label="Admin" title="Admin"><span class="profile-avatar" aria-hidden="true"></span><span>Admin</span></div>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn icon-button mobile-menu" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
          <i class="fa-light fa-bars" aria-hidden="true"></i>
        </button>
        <h1 class="page-title"><i class="fa-light fa-house" aria-hidden="true"></i> Dashboard</h1>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn icon-button theme-toggle" aria-label="Switch to light theme" title="Switch to light theme">
          <i class="fa-light fa-sun" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <main id="main" class="dashboard-scroll" tabindex="-1" aria-label="Dashboard content"></main>

    <footer class="workspace-footer">
      <span>Evergreen</span>
      <span>Admin dashboard</span>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
